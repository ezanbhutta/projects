<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="IANEX Global">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C88A"/>
      <stop offset="0.5" stop-color="#C79A55"/>
      <stop offset="1" stop-color="#B07F3E"/>
    </linearGradient>
  </defs>
  <!-- ring -->
  <circle cx="180" cy="75" r="66" fill="none" stroke="url(#gold)" stroke-width="2.2" opacity="0.95"/>
  <!-- IANEX wordmark -->
  <text x="180" y="84" text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif" font-weight="600"
        font-size="56" letter-spacing="2" fill="url(#gold)">IANEX</text>
  <!-- GLOBAL -->
  <text x="180" y="112" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif" font-weight="500"
        font-size="19" letter-spacing="10" fill="url(#gold)">GLOBAL</text>
</svg>
