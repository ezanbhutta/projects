<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Preview — IANEX Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{background:var(--navy-800);color:#eef3fa}
  .rp{padding:84px var(--gutter) 96px;position:relative;overflow:hidden;
    background:radial-gradient(120% 120% at 80% -10%,#1c4a7e 0%,#0f2d52 50%,#081b33 80%)}
  .rp::after{content:"";position:absolute;left:-160px;bottom:-160px;width:480px;height:480px;border:1px solid var(--hair-gold);border-radius:50%}
  .rp-head{max-width:840px;margin:0 auto 64px;text-align:center;position:relative;z-index:2}
  .rp-head .eyebrow{justify-content:center}
  .rp-head h2{font-size:3rem;color:#fff;margin-bottom:18px}
  .rp-head p{color:#bccadd;font-size:1.2rem;max-width:640px;margin:0 auto}
  .phones{display:flex;justify-content:center;gap:56px;position:relative;z-index:2;flex-wrap:wrap}
  .phone{width:340px}
  .phone .frame{border:10px solid #0a1a30;border-radius:44px;overflow:hidden;box-shadow:0 50px 90px -44px rgba(0,0,0,.75);background:#0a1a30;height:720px}
  .phone .frame img{width:100%;display:block}
  .phone .cap{text-align:center;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-lt);margin-top:22px}
</style>
</head>
<body>
  <div class="rp">
    <div class="rp-head">
      <p class="eyebrow">Fully Responsive</p>
      <h2>Designed mobile-first, not as an afterthought</h2>
      <p>Every page adapts cleanly to tablet and mobile — sticky navigation, tap-friendly 44px targets, and the booking CTA always within reach.</p>
    </div>
    <div class="phones">
      <div class="phone"><div class="frame"><img src="assets/preview/m-home.png" alt="Home on mobile"></div><div class="cap">Home</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-services.png" alt="Services on mobile"></div><div class="cap">Services</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-contact.png" alt="Contact on mobile"></div><div class="cap">Contact</div></div>
    </div>
  </div>
</body>
</html>
