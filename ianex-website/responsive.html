<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Preview — IANEX Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .rp{padding:80px var(--gutter) 96px;background:var(--dark);color:#fff}
  .rp-head{max-width:820px;margin:0 auto 56px;text-align:center}
  .rp-head .eyebrow{color:var(--accent-soft);justify-content:center;display:inline-flex}
  .rp-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,4vw,3rem);letter-spacing:-.035em;margin:16px 0 0}
  .rp-head h2 .soft{color:rgba(255,255,255,.55)}
  .phones{display:flex;justify-content:center;gap:48px;flex-wrap:wrap}
  .phone{width:320px}
  .phone .frame{border:9px solid #05070d;border-radius:40px;overflow:hidden;height:680px;background:#05070d;box-shadow:0 50px 90px -44px rgba(0,0,0,.7)}
  .phone .frame img{width:100%;display:block}
  .phone .cap{text-align:center;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-soft);margin-top:18px}
</style>
</head>
<body>
  <div class="rp">
    <div class="rp-head">
      <span class="eyebrow">Fully responsive</span>
      <h2>Designed mobile-first, <span class="soft">not as an afterthought.</span></h2>
    </div>
    <div class="phones">
      <div class="phone"><div class="frame"><img src="assets/preview/m-home.png" alt="Home on mobile"></div><div class="cap">Home</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-services.png" alt="Services on mobile"></div><div class="cap">Services</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-contact.png" alt="Contact on mobile"></div><div class="cap">Contact</div></div>
    </div>
  </div>
</body>
</html>
