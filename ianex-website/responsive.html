<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Preview. IANEX Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;560;600;680;760&family=Newsreader:ital,opsz,wght@1,18..72,400;1,18..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .rp{padding:84px var(--gutter) 96px;background:var(--navy);color:var(--bone)}
  .rp-head{max-width:880px;margin:0 auto 60px;text-align:center}
  .rp-head .kicker{justify-content:center;color:var(--ochre-2)}
  .rp-head h2{font-family:var(--f-display);font-weight:680;font-size:clamp(2.2rem,4.5vw,3.4rem);letter-spacing:-.03em;margin:18px 0 0}
  .rp-head h2 .i{font-family:var(--f-serif);font-style:italic;font-weight:400;color:var(--ochre-2)}
  .phones{display:flex;justify-content:center;gap:54px;flex-wrap:wrap}
  .phone{width:340px}
  .phone .frame{border:9px solid #0c1a2c;border-radius:42px;overflow:hidden;height:720px;background:#0c1a2c;box-shadow:0 50px 90px -44px rgba(0,0,0,.6)}
  .phone .frame img{width:100%;display:block}
  .phone .cap{text-align:center;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre-2);margin-top:20px}
</style>
</head>
<body>
  <div class="rp">
    <div class="rp-head">
      <span class="kicker">Fully Responsive</span>
      <h2>Designed mobile-first, <span class="i">not as an afterthought.</span></h2>
    </div>
    <div class="phones">
      <div class="phone"><div class="frame"><img src="assets/preview/m-home.png" alt="Home on mobile"></div><div class="cap">Home</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-services.png" alt="Services on mobile"></div><div class="cap">Services</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-contact.png" alt="Contact on mobile"></div><div class="cap">Contact</div></div>
    </div>
  </div>
</body>
</html>
