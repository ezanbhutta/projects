<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Preview — IANEX Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { background: var(--navy-deep); color:#eef2f8; }
  .rp { padding: 80px var(--gutter) 90px; position:relative; overflow:hidden; }
  .rp::after { content:""; position:absolute; left:-160px; bottom:-160px; width:480px;height:480px;border:1px solid var(--line-navy); border-radius:50%; }
  .rp-head { max-width:820px; margin:0 auto 64px; text-align:center; position:relative; z-index:2; }
  .rp-head .kicker { color:var(--clay); justify-content:center; }
  .rp-head h2 { font-size:3rem; color:#fff; margin-bottom:18px; }
  .rp-head p { color:#c7d2e3; font-size:1.2rem; max-width:620px; margin:0 auto; }
  .phones { display:flex; justify-content:center; gap:56px; position:relative; z-index:2; flex-wrap:wrap; }
  .phone { width:340px; }
  .phone .frame { border:10px solid #0b1b32; border-radius:42px; overflow:hidden; box-shadow:0 40px 80px -40px rgba(0,0,0,.7); background:#0b1b32; height:720px; }
  .phone .frame img { width:100%; display:block; }
  .phone .cap { text-align:center; font-family:var(--f-sans); font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--clay); margin-top:22px; }
</style>
</head>
<body>
  <div class="rp">
    <div class="rp-head">
      <p class="kicker">Fully Responsive</p>
      <h2>Designed mobile-first, not as an afterthought</h2>
      <p>Every page adapts cleanly to tablet and mobile — sticky navigation, tap-friendly 44px targets, and the booking CTA always within reach.</p>
    </div>
    <div class="phones">
      <div class="phone"><div class="frame"><img src="assets/preview/m-home.png" alt="Home on mobile"></div><div class="cap">Home</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-services.png" alt="Services on mobile"></div><div class="cap">Services</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-contact.png" alt="Contact on mobile"></div><div class="cap">Contact</div></div>
    </div>
  </div>
</body>
</html>
