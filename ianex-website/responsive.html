<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Preview. IANEX Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{background:var(--teal-deep);color:#eafaf7}
  .rp{padding:84px var(--gutter) 96px;position:relative;overflow:hidden;
    background:radial-gradient(110% 100% at 50% -10%,var(--teal) 0%,var(--teal-deep) 60%)}
  .rp::after{content:"";position:absolute;left:-160px;bottom:-160px;width:480px;height:480px;border:1px solid rgba(255,255,255,.14);border-radius:50%}
  .rp-head{max-width:840px;margin:0 auto 64px;text-align:center;position:relative;z-index:2}
  .rp-head .eyebrow{justify-content:center;color:var(--gold-bright)}
  .rp-head .eyebrow::before{background:var(--gold-bright)}
  .rp-head h2{font-size:3rem;color:#fff;margin-bottom:18px}
  .rp-head p{color:#cbeae5;font-size:1.2rem;max-width:640px;margin:0 auto}
  .phones{display:flex;justify-content:center;gap:56px;position:relative;z-index:2;flex-wrap:wrap}
  .phone{width:340px}
  .phone .frame{border:10px solid rgba(0,0,0,.35);border-radius:44px;overflow:hidden;box-shadow:0 50px 90px -44px rgba(0,0,0,.6);background:#000;height:720px}
  .phone .frame img{width:100%;display:block}
  .phone .cap{text-align:center;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright);margin-top:22px}
</style>
</head>
<body>
  <div class="rp">
    <div class="rp-head">
      <p class="eyebrow">Fully Responsive</p>
      <h2>Designed mobile-first, not as an afterthought</h2>
      <p>Every page adapts cleanly to tablet and mobile, with a sticky header, tap-friendly targets, and the booking call to action always within reach.</p>
    </div>
    <div class="phones">
      <div class="phone"><div class="frame"><img src="assets/preview/m-home.png" alt="Home on mobile"></div><div class="cap">Home</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-services.png" alt="Services on mobile"></div><div class="cap">Services</div></div>
      <div class="phone"><div class="frame"><img src="assets/preview/m-contact.png" alt="Contact on mobile"></div><div class="cap">Contact</div></div>
    </div>
  </div>
</body>
</html>
