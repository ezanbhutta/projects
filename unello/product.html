<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product · Unello</title>
  <meta name="description" content="A Unello bracelet. Wear it, be seen as open, say hello.">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header"></div>

  <main id="main">
    <div class="wrap section-sm">
      <nav class="small faint mb-4" aria-label="Breadcrumb" id="crumb"></nav>

      <div class="mock-toggle mb-6" role="group" aria-label="Preview inventory state (design build only)">
        <span class="lbl">Preview state</span>
        <button data-state="in" aria-pressed="true">In stock</button>
        <button data-state="low" aria-pressed="false">Low stock</button>
        <button data-state="out" aria-pressed="false">Sold out</button>
        <button data-state="pre" aria-pressed="false">Pre-order</button>
      </div>

      <div class="pdp-grid">
        <div class="gallery">
          <div class="gallery-main"><img id="mainImg" alt=""></div>
          <div class="gallery-thumbs" id="thumbs" role="group" aria-label="Product images"></div>
        </div>
        <div class="buy-box" id="buyBox"></div>
      </div>

      <section class="section-sm">
        <div class="section-head row"><h2>You may also like</h2><a class="ulink" href="shop.html">View all</a></div>
        <div class="grid cols-3" id="related"></div>
      </section>
    </div>
  </main>

  <div class="sticky-buy" id="stickyBuy">
    <span class="price" id="stickyPrice"></span>
    <button class="btn btn-primary" style="flex:1" id="stickyBtn">Add to bag</button>
  </div>

  <div id="footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/brand.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const U = window.UNELLO, $ = (s)=>document.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
    const id = new URLSearchParams(location.search).get("id") || U.products[0].id;
    const p = U.getProduct(id) || U.products[0];
    let state = p.inventory, size = null, qty = 1;
    document.title = `${p.name} · Unello`;
    $("#crumb").innerHTML = `<a href="shop.html">Shop</a> / <span>${p.name}</span>`;

    function setMain(i){ $("#mainImg").src=U.pimg(p,i,1000,1250); $("#mainImg").alt=`${p.name}, image ${i+1}`;
      $$("#thumbs button").forEach((b,bi)=>b.setAttribute("aria-current", String(bi===i))); }
    $("#thumbs").innerHTML = p.images.map((id,i)=>`<button aria-current="${i===0}" aria-label="Image ${i+1}"><img src="${U.img(id,200,200)}" alt=""></button>`).join("");
    $$("#thumbs button").forEach((b,i)=>b.addEventListener("click",()=>setMain(i)));
    setMain(0);

    function renderBuyBox(){
      const out = state==="out", pre = state==="pre", low = state==="low";
      const chips = p.sizes.map(s=>`<button class="chip" aria-pressed="${s===size}" data-size="${s}" ${out?'disabled':''}>${s}</button>`).join("");
      let primary;
      if(out) primary = `<button class="btn btn-outline btn-block btn-lg" data-waitlist="${p.id}">Join the waitlist</button>`;
      else if(pre) primary = `<button class="btn btn-red btn-block btn-lg" data-preorder="${p.id}">Pre-order, ships in 3 to 4 weeks</button>`;
      else primary = `<button class="btn btn-primary btn-block btn-lg" id="addBtn">Add to bag</button>
                      <button class="btn btn-outline btn-block" id="buyNow">Buy now</button>`;
      const invLine = out ? "Currently sold out. Join the waitlist and we'll email you the moment it's back."
        : pre ? "Pre-order now. Ships in 3 to 4 weeks." : low ? "Only a few left." : "In stock. Ships in 1 to 2 business days.";

      $("#buyBox").innerHTML = `
        <div class="stack">
          ${state!=="in" ? U.invBadge(state) : ""}
          <h1 style="font-size:clamp(28px,3.4vw,40px)">${p.name}</h1>
          <div class="buy-price">$${p.price}</div>
          <p class="muted">${p.blurb}</p>
        </div>
        <div class="stack">
          <div class="between"><span class="small" style="font-weight:500">Size</span>
            <button class="ulink small" data-find-size>Find my size</button></div>
          <div class="chip-row" id="sizeChips">${chips}</div>
          <p class="field-error" id="sizeErr" style="display:none">Please pick a size.</p>
        </div>
        ${out ? "" : `<div class="flex" style="align-items:center;gap:var(--s-4)">
          <span class="small" style="font-weight:500">Qty</span>
          <div class="stepper" aria-label="Quantity">
            <button id="qDec" aria-label="Decrease">−</button>
            <input id="qInp" value="${qty}" inputmode="numeric" aria-label="Quantity">
            <button id="qInc" aria-label="Increase">+</button>
          </div></div>`}
        <div class="stack">${primary}</div>
        <p class="small muted">${invLine}</p>
        <div class="trust">
          <div class="item">${U.svg("truck")} Free shipping over $75</div>
          <div class="item">${U.svg("refresh")} 30 day returns</div>
          <div class="item">${U.svg("box")} Ships from the US</div>
        </div>
        <div class="note">You're always in control. Wearing it means you're open, never obligated.</div>
        <div class="accordion" id="pdpAcc"></div>`;

      const items = [
        ["The idea", `<p>${p.blurb}</p><p>Wear it where it's seen. People who know the code notice, and a hello becomes a little easier. The bracelet does the talking, so you don't have to.</p>`],
        ["Sizing", `<p>Bracelets come in XS to L. Cord styles are adjustable. Not sure? Use <button class="ulink" data-find-size>Find my size</button>.</p>`],
        ["Materials &amp; care", `<p>${p.material}</p><p>Wipe clean with a soft cloth. Water-friendly, but store dry.</p>`],
        ["Shipping &amp; returns", `<p>Ships in 1 to 2 business days, free over $75. 30 day returns, no fuss.</p>`],
      ];
      $("#pdpAcc").innerHTML = items.map(([q,a],i)=>`
        <div class="accordion-item">
          <button class="accordion-trigger" aria-expanded="${i===0?'true':'false'}" aria-controls="pa${i}">${q}<i data-ico="plus"></i></button>
          <div class="accordion-panel" id="pa${i}"><div class="panel-inner">${a}</div></div>
        </div>`).join("");

      U.hydrateIcons($("#buyBox")); U.initAccordions($("#buyBox")); bindBuy(); syncSticky();
    }

    function bindBuy(){
      $$("#sizeChips .chip").forEach(c=>c.addEventListener("click",()=>{
        if(c.disabled) return; size=c.dataset.size;
        $$("#sizeChips .chip").forEach(x=>x.setAttribute("aria-pressed", String(x===c)));
        $("#sizeErr").style.display="none"; syncSticky();
      }));
      const qInp=$("#qInp");
      $("#qDec")?.addEventListener("click",()=>{ qty=Math.max(1,qty-1); qInp.value=qty; });
      $("#qInc")?.addEventListener("click",()=>{ qty=qty+1; qInp.value=qty; });
      qInp?.addEventListener("change",()=>{ qty=Math.max(1,parseInt(qInp.value)||1); qInp.value=qty; });
      $("#addBtn")?.addEventListener("click", addCurrent);
      $("#buyNow")?.addEventListener("click", ()=>{ if(addCurrent()) U.toast("Buy now is external, stubbed in this build.","info"); });
    }
    function addCurrent(){
      if(!size){ $("#sizeErr").style.display="block"; U.toast("Pick a size first.","error"); return false; }
      U.addToCart(p.id, size, qty);
      U.toast("Added to bag.", "success", { label:"View bag", fn:()=>U.openDrawer("cart") });
      return true;
    }
    function syncSticky(){
      $("#stickyPrice").textContent = "$"+p.price;
      const btn=$("#stickyBtn"); btn.style.flex="1";
      if(state==="out"){ btn.textContent="Join the waitlist"; btn.className="btn btn-outline"; btn.onclick=()=>U.openWaitlist(p,"waitlist"); }
      else if(state==="pre"){ btn.textContent="Pre-order"; btn.className="btn btn-red"; btn.onclick=()=>U.openWaitlist(p,"pre"); }
      else { btn.textContent="Add to bag"; btn.className="btn btn-primary"; btn.onclick=addCurrent; }
    }
    const io = new IntersectionObserver((es)=>es.forEach(en=>{
      $("#stickyBuy").classList.toggle("show", !en.isIntersecting && window.innerWidth<900);
    }), {threshold:0});
    setTimeout(()=>{ const t=$("#buyBox"); if(t) io.observe(t); }, 200);

    $$(".mock-toggle button").forEach(b=>b.addEventListener("click",()=>{
      state=b.dataset.state; size=null; qty=1;
      $$(".mock-toggle button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
      renderBuyBox();
    }));
    renderBuyBox();

    const rel = U.products.filter(x=>x.id!==p.id).slice(0,3);
    $("#related").innerHTML = rel.map(U.productCard).join("");
    U.hydrateIcons(document);
  </script>
</body>
</html>
