<!DOCTYPE html>
<html lang="en">
<head>

  <title>Unello — Open Signal (standalone preview)</title>
  <meta name="description" content="Unello UI/UX design — single-file standalone preview. Make saying hello easier.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%23FF5A6E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   UNELLO — Design System  ·  "Open Signal"
   Single source of truth for tokens + components (spec §2, §3, §7).
   No hardcoded colour/space in components — variables only.
   ===================================================================== */

/* ------------------------------------------------------------------ */
/* 1. TOKENS (§2)                                                      */
/* ------------------------------------------------------------------ */
:root {
  /* --- Colour · Base --- */
  --paper:        #FCFBF8;
  --surface:      #FFFFFF;
  --ink:          #181410;
  --ink-soft:     #6A6157;
  --line:         #ECE6DC;

  /* --- Signal colours · protagonists --- */
  --social:       #F59E2C;   /* "Sun"  — Social tier */
  --social-tint:  #FDEFD9;
  --social-ink:   #8A5408;   /* darkened Sun for AA text on tint */
  --dating:       #FF5A6E;   /* "Rose" — Dating tier */
  --dating-tint:  #FFE0E4;
  --dating-ink:   #B23044;   /* darkened Rose for AA text on tint */

  /* --- System --- */
  --ok:           #2FA36B;
  --warn:         #D9534F;

  /* --- Per-tier dynamic slots (set by [data-tier]) --- */
  --tier:         var(--social);
  --tier-tint:    var(--social-tint);
  --tier-ink:     var(--social-ink);

  /* --- Spacing (4px base) --- */
  --s-1: 4px;   --s-2: 8px;   --s-3: 12px;  --s-4: 16px;  --s-5: 24px;
  --s-6: 32px;  --s-7: 48px;  --s-8: 64px;  --s-9: 96px;  --s-10: 128px;

  /* --- Radius --- */
  --r-sm: 10px; --r-md: 16px; --r-lg: 24px; --r-pill: 999px;

  /* --- Elevation (warm-tinted) --- */
  --shadow-sm: 0 1px 2px rgba(24,20,16,.04);
  --shadow:    0 1px 2px rgba(24,20,16,.04), 0 10px 30px rgba(24,20,16,.07);
  --shadow-lg: 0 2px 6px rgba(24,20,16,.06), 0 24px 60px rgba(24,20,16,.12);

  /* --- Motion --- */
  --ease: cubic-bezier(.22,.61,.36,1);
  --t-fast: 150ms;
  --t-med:  220ms;
  --t-slow: 300ms;

  /* --- Type --- */
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --maxw: 1200px;
  --header-h: 64px;
}

[data-tier="social"] { --tier: var(--social); --tier-tint: var(--social-tint); --tier-ink: var(--social-ink); }
[data-tier="dating"] { --tier: var(--dating); --tier-tint: var(--dating-tint); --tier-ink: var(--dating-ink); }

/* ------------------------------------------------------------------ */
/* 2. RESET / BASE                                                     */
/* ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img, svg, video { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
ul { list-style: none; padding: 0; }
:focus { outline: none; }
:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
  border-radius: 4px;
}
.skip-link {
  position: absolute; left: var(--s-4); top: -200px; z-index: 200;
  background: var(--ink); color: var(--paper);
  padding: var(--s-3) var(--s-4); border-radius: var(--r-sm);
  transition: top var(--t-fast) var(--ease);
}
.skip-link:focus { top: var(--s-4); }

/* ------------------------------------------------------------------ */
/* 3. TYPOGRAPHY (§2.2)                                                */
/* ------------------------------------------------------------------ */
.display-xl, .display-l, h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; }
.display-xl { font-size: clamp(44px, 8vw, 72px); font-weight: 700; letter-spacing: -.02em; }
.display-l  { font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: -.015em; }
h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: -.015em; }
h2, .h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 600; letter-spacing: -.01em; }
h3, .h3 { font-size: clamp(20px, 2.6vw, 24px); font-weight: 600; line-height: 1.15; }
.body-lg { font-size: clamp(16px, 2.2vw, 18px); }
.small { font-size: 14px; }
.eyebrow {
  font-size: 12px; font-weight: 500; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-soft);
}
.muted { color: var(--ink-soft); }
.text-tier { color: var(--tier-ink); }
.balance { text-wrap: balance; }
.pretty { text-wrap: pretty; }

/* ------------------------------------------------------------------ */
/* 4. LAYOUT                                                           */
/* ------------------------------------------------------------------ */
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--s-4); }
@media (min-width: 768px){ .wrap { padding-inline: var(--s-6); } }
.section { padding-block: var(--s-8); }
@media (min-width: 768px){ .section { padding-block: var(--s-9); } }
.section-tight { padding-block: var(--s-7); }
.stack > * + * { margin-top: var(--s-4); }
.center { text-align: center; }
.grid { display: grid; gap: var(--s-5); }
.cols-2 { grid-template-columns: 1fr; }
.cols-3 { grid-template-columns: 1fr; }
.cols-4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 768px){
  .cols-2 { grid-template-columns: repeat(2, 1fr); }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  .cols-4 { grid-template-columns: repeat(4, 1fr); }
}
.flex { display: flex; gap: var(--s-3); }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); }
.flex-wrap { flex-wrap: wrap; }
.divider { height: 1px; background: var(--line); border: 0; }

/* ------------------------------------------------------------------ */
/* 5. SIGNAL TOKEN (§3 signature) — dot + pulsing ring (§7)            */
/* ------------------------------------------------------------------ */
.signal {
  --dot: 14px;
  position: relative;
  display: inline-grid; place-items: center;
  width: var(--dot); height: var(--dot);
  flex: 0 0 auto;
}
.signal::before { /* the dot */
  content: ""; grid-area: 1/1;
  width: 100%; height: 100%; border-radius: 50%;
  background: var(--tier);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tier) 18%, transparent);
}
.signal::after { /* the pulse ring */
  content: ""; grid-area: 1/1;
  width: 100%; height: 100%; border-radius: 50%;
  border: 2px solid var(--tier);
  animation: pulse 2s var(--ease) infinite;
}
.signal.sm { --dot: 10px; }
.signal.md { --dot: 14px; }
.signal.lg { --dot: 22px; }
.signal.xl { --dot: 40px; }
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .7; }
  70%  { transform: scale(2.6); opacity: 0;  }
  100% { transform: scale(2.6); opacity: 0;  }
}
@media (prefers-reduced-motion: reduce){
  .signal::after { animation: none; opacity: 0; }
}

/* ------------------------------------------------------------------ */
/* 6. BRAND LOCKUP (logo)                                              */
/* ------------------------------------------------------------------ */
.brand { display: inline-flex; align-items: center; gap: var(--s-2); }
.brand-mark { width: 30px; height: 26px; color: var(--dating); }
.brand-word {
  font-family: var(--font-display); font-weight: 700;
  font-size: 22px; letter-spacing: -.02em; color: var(--ink);
}

/* ------------------------------------------------------------------ */
/* 7. BUTTONS (§3)                                                     */
/* ------------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 48px; padding: 0 var(--s-5);
  font-weight: 600; font-size: 16px; line-height: 1;
  border-radius: var(--r-pill); border: 1.5px solid transparent;
  cursor: pointer; user-select: none; white-space: nowrap;
  transition: transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), opacity var(--t-fast);
}
.btn:active { transform: translateY(1px) scale(.99); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-secondary:hover { background: var(--ink); color: var(--paper); }
.btn-text { min-height: 44px; padding: 0 var(--s-2); background: transparent; color: var(--ink); }
.btn-text::after { content: ""; }
.btn-text:hover { text-decoration: underline; text-underline-offset: 4px; }
.btn-tier { background: var(--tier); color: var(--ink); }
.btn-tier:hover { box-shadow: var(--shadow); transform: translateY(-1px); filter: saturate(1.05); }
.btn-block { width: 100%; }
.btn-lg { min-height: 54px; font-size: 17px; padding: 0 var(--s-6); }
.btn:disabled, .btn[aria-disabled="true"] {
  opacity: .45; cursor: not-allowed; pointer-events: none;
}
.btn .ico { width: 18px; height: 18px; }

/* ------------------------------------------------------------------ */
/* 8. HEADER (§4.2)                                                    */
/* ------------------------------------------------------------------ */
.announce {
  background: var(--ink); color: var(--paper);
  font-size: 13px; text-align: center; padding: var(--s-2) var(--s-4);
  letter-spacing: .01em;
}
.announce .signal { --dot: 8px; vertical-align: middle; margin-right: 6px; }
.announce::before { content:""; }
.site-header {
  position: sticky; top: 0; z-index: 90;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--t-med) var(--ease), background var(--t-med);
}
.site-header.scrolled { border-bottom-color: var(--line); background: color-mix(in srgb, var(--paper) 94%, transparent); }
.header-bar {
  display: flex; align-items: center; justify-content: space-between;
  height: var(--header-h); gap: var(--s-4);
}
.site-header.scrolled .header-bar { height: 56px; }
.nav-desktop { display: none; gap: var(--s-6); }
.nav-desktop a { font-weight: 500; font-size: 15px; color: var(--ink); position: relative; padding-block: var(--s-2); }
.nav-desktop a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: var(--dating); transform: scaleX(0); transform-origin: left;
  transition: transform var(--t-med) var(--ease);
}
.nav-desktop a:hover::after, .nav-desktop a[aria-current="page"]::after { transform: scaleX(1); }
.header-actions { display: flex; align-items: center; gap: var(--s-2); }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center;
  background: transparent; border: 0; border-radius: var(--r-pill); cursor: pointer;
  position: relative; transition: background var(--t-fast);
}
.icon-btn:hover { background: var(--line); }
.icon-btn .ico { width: 22px; height: 22px; }
.cart-count {
  position: absolute; top: 4px; right: 2px;
  min-width: 18px; height: 18px; padding: 0 4px;
  background: var(--dating); color: var(--ink);
  font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  border-radius: var(--r-pill);
}
.cart-count[hidden] { display: none; }
.hamburger { display: inline-grid; }
@media (min-width: 900px){
  .nav-desktop { display: flex; }
  .hamburger { display: none; }
}

/* Mobile full-screen sheet */
.mobile-sheet {
  position: fixed; inset: 0; z-index: 100;
  background: var(--paper);
  transform: translateY(-100%);
  transition: transform var(--t-slow) var(--ease);
  display: flex; flex-direction: column;
  visibility: hidden;
}
.mobile-sheet.open { transform: translateY(0); visibility: visible; }
.mobile-sheet nav { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-6) var(--s-4); }
.mobile-sheet nav a {
  font-family: var(--font-display); font-size: 30px; font-weight: 600;
  padding: var(--s-3) 0; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: var(--s-3);
}

/* ------------------------------------------------------------------ */
/* 9. CARDS, RAILS, TILES (§3)                                         */
/* ------------------------------------------------------------------ */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden;
  transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }

/* product card */
.product-card { display: flex; flex-direction: column; position: relative; }
.product-media {
  position: relative; aspect-ratio: 4/5; background: var(--paper); overflow: hidden;
}
.product-media > a { display: block; width: 100%; height: 100%; }
.product-media img { width: 100%; height: 100%; object-fit: cover; transition: opacity var(--t-slow) var(--ease); }
.product-media .img-2 { position: absolute; inset: 0; opacity: 0; }
.product-card:hover .img-2 { opacity: 1; }
.product-media .signal { position: absolute; top: var(--s-3); left: var(--s-3); }
.product-body { padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-1); flex: 1; }
.product-title { font-weight: 600; font-size: 16px; }
.product-meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: var(--s-2); }
.price { font-weight: 600; }
.quick-add {
  position: absolute; left: var(--s-3); right: var(--s-3); bottom: var(--s-3);
  opacity: 0; transform: translateY(8px);
  transition: opacity var(--t-med) var(--ease), transform var(--t-med) var(--ease);
}
.product-card:hover .quick-add, .product-card:focus-within .quick-add { opacity: 1; transform: translateY(0); }
@media (hover: none){ .quick-add { opacity: 1; transform: none; position: static; margin-top: var(--s-3); } }

/* rail */
.rail {
  display: grid; grid-auto-flow: column; grid-auto-columns: 78%;
  gap: var(--s-4); overflow-x: auto; scroll-snap-type: x mandatory;
  padding-bottom: var(--s-4); margin-inline: calc(var(--s-4) * -1); padding-inline: var(--s-4);
  scrollbar-width: thin;
}
.rail > * { scroll-snap-align: start; }
@media (min-width: 768px){
  .rail { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); grid-auto-columns: auto;
          overflow: visible; margin-inline: 0; padding-inline: 0; }
}

/* collection tile */
.tile {
  position: relative; border-radius: var(--r-lg); overflow: hidden;
  padding: var(--s-7) var(--s-5); min-height: 260px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: var(--s-3);
  background: var(--tier-tint); border: 1px solid color-mix(in srgb, var(--tier) 22%, var(--line));
  transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
}
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.tile .signal { position: absolute; top: var(--s-5); left: var(--s-5); }
.tile h3 { font-family: var(--font-display); font-size: 28px; }
.tile-arrow { display: inline-flex; align-items: center; gap: var(--s-2); font-weight: 600; }

/* ------------------------------------------------------------------ */
/* 10. BADGES / CHIPS / STEPPER                                        */
/* ------------------------------------------------------------------ */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  padding: 5px 10px; border-radius: var(--r-pill);
  background: var(--line); color: var(--ink-soft);
}
.badge.in   { background: color-mix(in srgb, var(--ok) 14%, transparent); color: #1c6e47; }
.badge.low  { background: var(--social-tint); color: var(--social-ink); }
.badge.out  { background: var(--line); color: var(--ink-soft); }
.badge.pre  { background: var(--dating-tint); color: var(--dating-ink); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.tier-pill {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: 6px 12px 6px 8px; border-radius: var(--r-pill);
  background: var(--tier-tint); color: var(--tier-ink);
  font-size: 13px; font-weight: 600;
}

.chip-row { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.chip {
  min-width: 48px; min-height: 44px; padding: 0 var(--s-4);
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--line); background: var(--surface);
  border-radius: var(--r-sm); cursor: pointer; font-weight: 500;
  transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast);
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"], .chip.selected { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chip:disabled { opacity: .4; cursor: not-allowed; text-decoration: line-through; }

.stepper {
  display: inline-flex; align-items: center;
  border: 1.5px solid var(--line); border-radius: var(--r-pill); overflow: hidden;
}
.stepper button {
  width: 44px; height: 44px; background: var(--surface); border: 0; cursor: pointer;
  font-size: 20px; line-height: 1; transition: background var(--t-fast);
}
.stepper button:hover { background: var(--line); }
.stepper button:disabled { opacity: .4; cursor: not-allowed; }
.stepper input {
  width: 44px; height: 44px; text-align: center; border: 0;
  background: var(--surface); -moz-appearance: textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ------------------------------------------------------------------ */
/* 11. FORMS                                                           */
/* ------------------------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field .req { color: var(--dating-ink); }
.input, .textarea, .select {
  width: 100%; min-height: 48px; padding: var(--s-3) var(--s-4);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-sm);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.textarea { min-height: 120px; resize: vertical; padding-top: var(--s-3); }
.input:hover, .textarea:hover, .select:hover { border-color: var(--ink-soft); }
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent);
}
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--warn); }
.field-error { font-size: 13px; color: var(--warn); display: none; }
.field[data-invalid="true"] .field-error { display: block; }
.field-hint { font-size: 13px; color: var(--ink-soft); }

.inline-capture { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.inline-capture .input { flex: 1; min-width: 200px; }

/* ------------------------------------------------------------------ */
/* 12. ACCORDION (§3)                                                  */
/* ------------------------------------------------------------------ */
.accordion { border-top: 1px solid var(--line); }
.accordion-item { border-bottom: 1px solid var(--line); }
.accordion-trigger {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-4) 0; background: transparent; border: 0; cursor: pointer;
  font-weight: 600; font-size: 16px; text-align: left;
}
.accordion-trigger .ico { width: 20px; height: 20px; transition: transform var(--t-med) var(--ease); flex: 0 0 auto; }
.accordion-trigger[aria-expanded="true"] .ico { transform: rotate(45deg); }
.accordion-panel {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--t-med) var(--ease);
}
.accordion-panel > div { overflow: hidden; }
.accordion-trigger[aria-expanded="true"] + .accordion-panel { grid-template-rows: 1fr; }
.accordion-panel .panel-inner { padding-bottom: var(--s-4); color: var(--ink-soft); }
.accordion-panel .panel-inner > * + * { margin-top: var(--s-3); }

/* ------------------------------------------------------------------ */
/* 13. TRUST STRIP / DECODE / STEPS                                    */
/* ------------------------------------------------------------------ */
.trust {
  display: flex; flex-wrap: wrap; gap: var(--s-4);
  padding: var(--s-4); border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--paper);
}
.trust .item { display: flex; align-items: center; gap: var(--s-2); font-size: 14px; }
.trust .ico { width: 20px; height: 20px; color: var(--ink-soft); flex: 0 0 auto; }

.decode-card {
  border-radius: var(--r-lg); padding: var(--s-6); border: 1px solid var(--line);
  background: var(--tier-tint); display: flex; flex-direction: column; gap: var(--s-3);
  position: relative; overflow: hidden;
}
.decode-card .signal { --dot: 26px; }
.decode-card .meaning { font-size: clamp(18px, 2.4vw, 22px); font-family: var(--font-display); font-weight: 600; }

.steps { display: grid; gap: var(--s-5); counter-reset: step; }
@media (min-width: 768px){ .steps { grid-template-columns: repeat(4, 1fr); } }
.step { display: flex; flex-direction: column; gap: var(--s-3); }
.step-head { display: flex; align-items: center; gap: var(--s-3); }
.step-num {
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  color: var(--ink-soft);
}
.step .ico-wrap {
  width: 52px; height: 52px; border-radius: var(--r-md);
  display: grid; place-items: center; background: var(--paper); border: 1px solid var(--line);
}
.step .ico-wrap .ico { width: 26px; height: 26px; color: var(--ink); }

/* ------------------------------------------------------------------ */
/* 14. CART DRAWER + MODAL + TOAST (§3)                                */
/* ------------------------------------------------------------------ */
.scrim {

  function svg(name, cls = "ico") {
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name] || ""}</svg>`;

  U.svg = svg;

  /* brand mark — interlocking links forming a heart (Unity + Hello) */

  const MARK = `<svg class="brand-mark" viewBox="0 0 64 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="-13" y="-19" width="26" height="38" rx="13" transform="translate(25 25) rotate(-40)"/>
      <rect x="-13" y="-19" width="26" height="38" rx="13" transform="translate(39 25) rotate(40)"/>
    </svg>`;
  U.brand = (sub) => `<a class="brand" href="#/" aria-label="Unello — home">
      ${MARK}<span class="brand-word">unello</span>${sub ? `<span class="sr-only">${sub}</span>` : ""}
    </a>`;

  function signal(tier, size = "md") { return `<span class="signal ${size}" data-tier="${tier}" role="img" aria-label="${tier} signal"></span>`; }
  U.signal = signal;

  /* ---------------- in-memory cart ---------------- */
  const cart = []; // {id, size, qty}
  U.cart = cart;
  function cartCount() { return cart.reduce((s, l) => s + l.qty, 0); }
  function cartSubtotal() { return cart.reduce((s, l) => s + U.getProduct(l.id).price * l.qty, 0); }
  function addToCart(id, size, qty = 1) {
    const line = cart.find((l) => l.id === id && l.size === size);
    if (line) line.qty += qty; else cart.push({ id, size, qty });
    syncCart();
  }
  function removeLine(idx) { cart.splice(idx, 1); syncCart(); }
  function setQty(idx, q) { if (q <= 0) removeLine(idx); else { cart[idx].qty = q; syncCart(); } }
  U.addToCart = addToCart;

  function syncCart() {
    const c = cartCount();
    $$(".cart-count").forEach((el) => { el.textContent = c; el.hidden = c === 0; });
    renderCartBody();
  }

  /* ---------------- header ---------------- */

    mount.id = "header"; mount.innerHTML = html;

    // scroll condense

    window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

    // mobile sheet

  /* ---------------- cart drawer ---------------- */
  function renderCartDrawer() {
    const html = `<div class="scrim" id="scrim"></div>
      <aside class="drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Your cart" inert>

    const mount = document.body.appendChild(document.createElement("div"));
    mount.id = "overlays"; mount.innerHTML = html;
    $("#scrim").addEventListener("click", closeDrawers);
    $$("[data-close-drawer]").forEach((b) => b.addEventListener("click", closeDrawers));
    $("#checkoutBtn").addEventListener("click", () => toast("Checkout is external — stubbed in this design build.", "info"));
    syncCart();

  function renderCartBody() {
    const body = $("#cartBody"); if (!body) return;
    const foot = $("#cartFoot");
    if (!cart.length) {
      foot.hidden = true;
      body.innerHTML = `<div class="empty-state">
        ${svg("cart", "ico")}
        <div><h3>Your cart is empty</h3><p class="muted mt-2">Pick your signal — Social or Dating — and wear it out.</p></div>
        <a class="btn btn-primary" href="#/shop" data-close-drawer>Shop Unello</a>
      </div>`;
      body.querySelector("[data-close-drawer]")?.addEventListener("click", closeDrawers);
      return;
    }
    foot.hidden = false;
    const sub = cartSubtotal();
    const remain = Math.max(0, FREE_SHIP - sub);
    const pct = Math.min(100, (sub / FREE_SHIP) * 100);
    const ship = `<div class="ship-bar">
      <div class="small">${remain > 0 ? `You're ${money(remain)} from <strong>free shipping</strong>` : `🎉 You've unlocked <strong>free shipping</strong>`}</div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    </div>`;

    const lines = cart.map((l, i) => {
      const p = U.getProduct(l.id);
      return `<div class="cart-line" data-tier="${p.tier}">
        <img src="${p.images[0]}" alt="${p.name}">
        <div class="info">
          <div class="row"><strong class="small">${p.name}</strong><span class="price small">${money(p.price * l.qty)}</span></div>
          <div class="small muted flex" style="align-items:center;gap:6px">${signal(p.tier, "sm")} ${U.tiers[p.tier].label} · Size ${l.size}</div>
          <div class="row mt-2">
            <div class="stepper" aria-label="Quantity for ${p.name}">
              <button data-dec="${i}" aria-label="Decrease">−</button>
              <input value="${l.qty}" inputmode="numeric" aria-label="Quantity" data-qty="${i}">
              <button data-inc="${i}" aria-label="Increase">+</button>
            </div>
            <button class="link-remove" data-rm="${i}">Remove</button>
          </div>
        </div>
      </div>`;
    }).join("");

    // cross-sell: a piece from the cart's first tier not already in cart
    const inCart = new Set(cart.map((l) => l.id));
    const firstTier = U.getProduct(cart[0].id).tier;
    const xs = U.byTier(firstTier).find((p) => !inCart.has(p.id) && p.inventory !== "out");
    const cross = xs ? `<div class="mt-5"><div class="eyebrow">Complete the set</div>
      <div class="cart-line" data-tier="${xs.tier}" style="border:0">
        <img src="${xs.images[0]}" alt="${xs.name}">
        <div class="info">
          <div class="row"><strong class="small">${xs.name}</strong><span class="price small">${money(xs.price)}</span></div>
          <p class="small muted">${xs.blurb}</p>
          <button class="btn btn-secondary" style="min-height:40px" data-xadd="${xs.id}" data-xsize="${xs.sizes[1] || xs.sizes[0]}">Add ${svg("plus")}</button>
        </div>
      </div></div>` : "";

    body.innerHTML = ship + `<div class="mt-4">${lines}</div>` + cross;
    $("#cartSubtotal").textContent = money(sub);

    body.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => setQty(+b.dataset.inc, cart[+b.dataset.inc].qty + 1));
    body.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => setQty(+b.dataset.dec, cart[+b.dataset.dec].qty - 1));
    body.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { removeLine(+b.dataset.rm); toast("Removed.", "info"); });
    body.querySelectorAll("[data-qty]").forEach((inp) => inp.onchange = () => { const q = parseInt(inp.value) || 1; setQty(+inp.dataset.qty, q); });
    body.querySelectorAll("[data-xadd]").forEach((b) => b.onclick = () => { addToCart(b.dataset.xadd, b.dataset.xsize); toast("Added to your set."); });
  }

  /* ---------------- drawers / focus / scroll lock ---------------- */
  let lastFocus = null;
  function lockScroll(on) { document.documentElement.style.overflow = on ? "hidden" : ""; }
  function openDrawer(which) {
    lastFocus = document.activeElement;
    $("#scrim").classList.add("open");
    const el = which === "size" ? $("#sizeDrawer") : $("#cartDrawer");
    el.classList.add("open"); el.removeAttribute("inert");

    el.querySelector("button, a, input")?.focus();

  U.openDrawer = openDrawer;
  function closeDrawers() {
    $("#scrim")?.classList.remove("open");
    $$(".drawer").forEach((d) => { d.classList.remove("open"); d.setAttribute("inert", ""); });
    lockScroll(false);
    lastFocus?.focus();

  U.closeDrawers = closeDrawers;

  /* ---------------- modal (waitlist / pre-order) ---------------- */
  function renderModal() {
    const html = `<div class="modal" id="waitModal" role="dialog" aria-modal="true" aria-labelledby="waitTitle" inert>

              <input class="input" id="wemail" name="email" type="email" required autocomplete="email"><span class="field-error">Enter a valid email.</span></div>

          </form>

        <div id="waitDone" hidden class="center stack">
          <span class="signal lg" data-tier="social" style="margin-inline:auto"></span>
          <h2>You're on the list.</h2>
          <p class="muted">We'll email you the moment it's back. Welcome to the movement.</p>
          <button class="btn btn-primary" data-close-modal>Done</button>
        </div>
      </div>
    </div>`;
    const mount = document.body.appendChild(document.createElement("div"));
    mount.id = "modals"; mount.innerHTML = html;
    $$("[data-close-modal]").forEach((b) => b.addEventListener("click", closeModal));
    $("#waitlistForm").addEventListener("submit", onWaitSubmit);
  }
  function openWaitlist(product, kind) {
    lastFocus = document.activeElement;
    const m = $("#waitModal"); m.classList.add("open"); m.removeAttribute("inert"); lockScroll(true);
    $("#waitForm").hidden = false; $("#waitDone").hidden = true;
    const pre = kind === "pre";
    $("#waitKind").textContent = pre ? "Pre-order" : "Join the waitlist";
    $("#waitTitle").textContent = pre ? "Reserve yours — ships in 3–4 weeks." : "You're early — we'll hold your spot.";
    $("#waitSub").textContent = pre ? "Pre-order now and you're first in line when it ships." : "Tell us where to reach you. No spam, just the drop.";
    $("#waitSubmit").textContent = pre ? "Pre-order now" : "Join the waitlist";
    $("#waitProduct") || $("#wproduct").setAttribute("value", "");
    if (product) { $("#wproduct").value = product.name; $("#wtier").value = product.tier; $("#waitDone .signal").setAttribute("data-tier", product.tier); }
    $("#wname").focus();
  }
  U.openWaitlist = openWaitlist;
  function closeModal() { const m = $("#waitModal"); m.classList.remove("open"); m.setAttribute("inert", ""); lockScroll(false); lastFocus?.focus(); }
  function onWaitSubmit(e) {
    e.preventDefault();
    const f = e.target;
    let ok = true;
    ["wname", "wemail"].forEach((id) => {
      const el = $("#" + id), field = el.closest(".field");
      const bad = id === "wemail" ? !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value) : !el.value.trim();
      field.dataset.invalid = bad; el.setAttribute("aria-invalid", bad); if (bad) ok = false;
    });
    if (!ok) return;
    $("#waitForm").hidden = true; $("#waitDone").hidden = false;
    $("#waitDone .signal").setAttribute("data-tier", $("#wtier").value);
    f.reset();
  }

  /* ---------------- toast ---------------- */
  function renderToastWrap() { const w = document.createElement("div"); w.className = "toast-wrap"; w.id = "toasts"; w.setAttribute("aria-live", "polite"); document.body.appendChild(w); }
  function toast(msg, type = "success", action) {
    const w = $("#toasts"); if (!w) return;
    const t = document.createElement("div");
    t.className = "toast" + (type === "error" ? " error" : "");
    t.innerHTML = `${svg(type === "error" ? "alert" : type === "info" ? "spark" : "check")}<span>${msg}</span>${action ? `<a href="#" data-act>${action.label}</a>` : ""}`;
    w.appendChild(t);
    if (action) t.querySelector("[data-act]").onclick = (e) => { e.preventDefault(); action.fn(); t.remove(); };
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, action ? 5000 : 2600);
  }
  U.toast = toast;

  /* ---------------- icon hydration ----------------
     Lets static HTML place icons with <i data-ico="arrow"></i>.        */
  function hydrateIcons(root = document) {
    $$("[data-ico]", root).forEach((el) => {
      if (el.dataset.icoDone) return; el.dataset.icoDone = "1";
      el.innerHTML = svg(el.dataset.ico, el.dataset.icoCls || "ico");
    });
  }
  U.hydrateIcons = hydrateIcons;

  /* ---------------- accordion ---------------- */
  function initAccordions(root = document) {
    $$(".accordion-trigger", root).forEach((btn) => {
      if (btn.dataset.bound) return; btn.dataset.bound = "1";
      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", String(!open));
      });
    });
  }
  U.initAccordions = initAccordions;

  /* ---------------- captures (email) ---------------- */
  function initCaptures(root = document) {
    $$("[data-capture]", root).forEach((form) => {
      if (form.dataset.bound) return; form.dataset.bound = "1";
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = form.querySelector('input[type="email"]');
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value)) { email.setAttribute("aria-invalid", "true"); toast("Enter a valid email.", "error"); return; }
        email.setAttribute("aria-invalid", "false"); form.reset();

      });

  }
  U.initCaptures = initCaptures;

  /* ---------------- reveal on scroll ---------------- */
  function prefersReduced() { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  function initReveal() {
    if (prefersReduced()) { $$(".reveal").forEach((el) => el.classList.add("in")); return; }
    const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.12 });
    $$(".reveal").forEach((el) => io.observe(el));
  }
  U.initReveal = initReveal;

  /* ---------------- product card (reusable) ---------------- */
  U.productCard = function (p) {
    const t = U.tiers[p.tier];
    const inv = U.invBadge(p.inventory);
    const soldOut = p.inventory === "out";
    const pre = p.inventory === "pre";
    let cta;
    if (soldOut) cta = `<button class="btn btn-secondary btn-block quick-add" data-waitlist="${p.id}">Join the waitlist</button>`;
    else if (pre) cta = `<button class="btn btn-tier btn-block quick-add" data-tier="${p.tier}" data-preorder="${p.id}">Pre-order</button>`;
    else cta = `<button class="btn btn-primary btn-block quick-add" data-quickadd="${p.id}">Quick add ${svg("plus")}</button>`;
    return `<article class="card product-card" data-tier="${p.tier}">
      <div class="product-media">
        <a href="#/product?id=${p.id}" aria-label="${p.name}" tabindex="-1">
          <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
          <img class="img-2" src="${p.images[1]}" alt="" loading="lazy">
        </a>
        ${signal(p.tier, "md")}
        ${cta}
      </div>
      <div class="product-body">
        <a href="#/product?id=${p.id}" class="product-title">${p.name}</a>
        <span class="small muted">${t.label} · ${p.type}</span>
        <div class="product-meta"><span class="price">${money(p.price)}</span>${inv}</div>
      </div>
    </article>`;
  };
  U.invBadge = function (inv) {
    if (inv === "in") return `<span class="badge in"><span class="dot"></span>In stock</span>`;
    if (inv === "low") return `<span class="badge low"><span class="dot"></span>Only a few left</span>`;
    if (inv === "out") return `<span class="badge out"><span class="dot"></span>Sold out</span>`;
    if (inv === "pre") return `<span class="badge pre"><span class="dot"></span>Pre-order</span>`;
    return "";
  };

  /* delegate quick-add / waitlist / preorder on any product grid */
  document.addEventListener("click", (e) => {
    const qa = e.target.closest("[data-quickadd]");
    if (qa) { e.preventDefault(); const p = U.getProduct(qa.dataset.quickadd); addToCart(p.id, p.sizes[1] || p.sizes[0]); toast("Added.", "success", { label: "View cart", fn: () => openDrawer("cart") }); return; }
    const wl = e.target.closest("[data-waitlist]");
    if (wl) { e.preventDefault(); openWaitlist(U.getProduct(wl.dataset.waitlist), "waitlist"); return; }
    const po = e.target.closest("[data-preorder]");
    if (po) { e.preventDefault(); openWaitlist(U.getProduct(po.dataset.preorder), "pre"); return; }
    const fs = e.target.closest("[data-find-size]");
    if (fs) { e.preventDefault(); openDrawer("size"); }
  });

  /* global ESC */
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("#waitModal")?.classList.contains("open")) return closeModal();
    if ($(".drawer.open")) return closeDrawers();

  });

  /* ---------------- boot ---------------- */

    renderHeader(opts); renderFooter(); renderCartDrawer(); renderModal(); renderToastWrap();
    hydrateIcons(); initAccordions(); initCaptures(); initReveal();
  };

  "product": {
    markup: "<main id=\"main\" data-tier=\"social\">\n    <div class=\"wrap section-tight\">\n      <nav class=\"small muted mb-4\" aria-label=\"Breadcrumb\" id=\"crumb\"></nav>\n\n      <!-- design-review control: mock inventory states -->\n      <div class=\"mock-toggle mb-5\" role=\"group\" aria-label=\"Preview inventory state (design build only)\">\n        <span class=\"lbl\">Preview state:</span>\n        <button data-state=\"in\" aria-pressed=\"true\">In stock</button>\n        <button data-state=\"low\" aria-pressed=\"false\">Low stock</button>\n        <button data-state=\"out\" aria-pressed=\"false\">Sold out</button>\n        <button data-state=\"pre\" aria-pressed=\"false\">Pre-order</button>\n      </div>\n\n      <div class=\"pdp-grid\">\n        <!-- gallery -->\n        <div class=\"gallery\">\n          <div class=\"gallery-main\">\n            <img id=\"mainImg\" alt=\"\">\n            <span class=\"signal lg\" id=\"galSignal\" data-tier=\"social\" style=\"position:absolute;top:16px;left:16px\"></span>\n          </div>\n          <div class=\"gallery-thumbs\" id=\"thumbs\" role=\"group\" aria-label=\"Product images\"></div>\n          <p class=\"small muted\">Pinch to zoom on mobile. Includes the signal in context, and a macro of the dot.</p>\n        </div>\n\n        <!-- buy box -->\n        <div class=\"buy-box\" id=\"buyBox\"></div>\n      </div>\n\n      <!-- cross-sell -->\n      <section class=\"section-tight\">\n        <h2 class=\"mb-4\">Pair it — complete the set</h2>\n        <div class=\"grid cols-2\" id=\"pairGrid\"></div>\n      </section>\n\n      <!-- related -->\n      <section class=\"section-tight\">\n        <div class=\"section-head with-link\"><h2 id=\"relTitle\">More like this</h2></div>\n        <div class=\"grid cols-4\" id=\"related\"></div>\n      </section>\n    </div>\n  </main>\n\n  <!-- sticky mobile add to cart -->\n  <div class=\"sticky-buy\" id=\"stickyBuy\">\n    <span class=\"price\" id=\"stickyPrice\"></span>\n    <button class=\"btn btn-primary\" style=\"flex:1\" id=\"stickyBtn\">Add to Cart</button>\n  </div>",
    render: function(){
try{

    const U = window.UNELLO, $ = (s)=>document.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
    const id = new URLSearchParams((location.hash.split('?')[1]||'')).get("id") || U.products[0].id;
    const p = U.getProduct(id) || U.products[0];
    const meta = U.tiers[p.tier];
    let state = p.inventory;      // mock-overridable
    let size = null, qty = 1, mainIdx = 0;

    document.title = `${p.name} — Unello`;
    $("#main").dataset.tier = p.tier;
    $("#galSignal").dataset.tier = p.tier;
    $("#crumb").innerHTML = `<a href="#/shop">Shop</a> / <a href="#/collection?tier=${p.tier}">${meta.label}</a> / <span>${p.name}</span>`;

    // gallery
    function setMain(i){ mainIdx=i; $("#mainImg").src=p.images[i]; $("#mainImg").alt=`${p.name} — image ${i+1}`;
      $$("#thumbs button").forEach((b,bi)=>b.setAttribute("aria-current", String(bi===i))); }
    $("#thumbs").innerHTML = p.images.map((src,i)=>`<button aria-current="${i===0}" aria-label="Image ${i+1}"><img src="${src}" alt=""></button>`).join("");
    $$("#thumbs button").forEach((b,i)=>b.addEventListener("click",()=>setMain(i)));
    setMain(0);

    function renderBuyBox(){
      const inv = U.invBadge(state);
      const out = state==="out", pre = state==="pre", low = state==="low";
      const sizeChips = p.sizes.map(s=>`<button class="chip" role="button" aria-pressed="${s===size}" data-size="${s}" ${out?'disabled':''}>${s}</button>`).join("");

      let primary;
      if(out) primary = `<button class="btn btn-secondary btn-block btn-lg" data-waitlist="${p.id}">Join the waitlist</button>`;
      else if(pre) primary = `<button class="btn btn-tier btn-block btn-lg" data-tier="${p.tier}" data-preorder="${p.id}">Pre-order now — ships in 3–4 weeks</button>`;
      else primary = `<button class="btn btn-primary btn-block btn-lg" id="addBtn">Add to Cart</button>
                      <button class="btn btn-secondary btn-block" id="buyNow">Buy Now</button>`;

      const invLine = out ? `Currently sold out — join the waitlist and we'll email you the moment it's back.`
        : pre ? `Pre-order now. Ships in 3–4 weeks.`
        : low ? `Only a few left.`
        : `In stock. Ships in 1–2 business days.`;

      $("#buyBox").innerHTML = `
        <div class="stack">
          <div class="flex" style="align-items:center;gap:var(--s-3)">
            <span class="tier-pill" data-tier="${p.tier}"><span class="signal sm" data-tier="${p.tier}"></span>${meta.label} — ${meta.colorName}</span>
            ${inv}
          </div>
          <h1 class="h2" style="font-family:var(--font-display)">${p.name}</h1>
          <div class="buy-price">${"$"+p.price}</div>
          <p class="meaning-line" data-tier="${p.tier}">${meta.meaning}</p>
          <p class="muted">${p.blurb}</p>
        </div>

        <div class="stack">
          <div class="flex-between"><span class="small" style="font-weight:600">Size</span>
            <button class="btn-text small" data-find-size style="min-height:auto;padding:4px">Find my size</button></div>
          <div class="chip-row" id="sizeChips">${sizeChips}</div>
          <p class="field-error" id="sizeErr" style="display:none">Please pick a size.</p>
        </div>

        ${out ? "" : `<div class="flex" style="align-items:center;gap:var(--s-4)">
          <span class="small" style="font-weight:600">Qty</span>
          <div class="stepper" aria-label="Quantity">
            <button id="qDec" aria-label="Decrease">−</button>
            <input id="qInp" value="${qty}" inputmode="numeric" aria-label="Quantity">
            <button id="qInc" aria-label="Increase">+</button>
          </div></div>`}

        <div class="stack">${primary}</div>
        <p class="small muted">${invLine}</p>

        <div class="trust">
          <div class="item">${U.svg("truck")} Free shipping over $75</div>
          <div class="item">${U.svg("refresh")} 30-day returns</div>
          <div class="item">${U.svg("box")} Ships from the US</div>
        </div>

        ${p.tier==="dating" ? `<div class="note-control">${U.svg("lock")}<span>You're always in control. Open doesn't mean obligated.</span></div>` : ""}

        <div class="accordion" id="pdpAcc"></div>`;

      // accordions
      const items = [
        ["Read the Signal — colour meaning", `<p><strong>${meta.label} is ${meta.colorName}.</strong> ${meta.long}</p><p>People who know the code read it at a glance. That's the whole idea — the colour does the talking so you don't have to.</p>`],
        ["Sizing", `<p>Bracelets come in XS–L; rings in US 6–10. Not sure? Use <button class="btn-text" data-find-size style="min-height:auto;padding:0;text-decoration:underline">Find my size</button>.</p>`],
        ["Shipping", `<p>Ships in 1–2 business days. Free over $75. Tracked delivery, ships from the US.</p>`],
        ["Returns", `<p>30 days, no fuss. If it's not right, send it back for a refund or swap.</p>`],
        ["Materials &amp; care", `<p>${p.material}</p><p>Wipe clean with a soft cloth. Water-friendly, but store dry to keep the signal bright.</p>`],
      ];
      $("#pdpAcc").innerHTML = items.map(([q,a],i)=>`
        <div class="accordion-item">
          <button class="accordion-trigger" aria-expanded="${i===0?'true':'false'}" aria-controls="pa${i}">${q}<i data-ico="plus"></i></button>
          <div class="accordion-panel" id="pa${i}"><div class="panel-inner">${a}</div></div>
        </div>`).join("");

      U.hydrateIcons($("#buyBox"));
      U.initAccordions($("#buyBox"));
      bindBuy();
      syncSticky();
    }

    function bindBuy(){
      $$("#sizeChips .chip").forEach(c=>c.addEventListener("click",()=>{
        if(c.disabled) return;
        size=c.dataset.size;
        $$("#sizeChips .chip").forEach(x=>x.setAttribute("aria-pressed", String(x===c)));
        $("#sizeErr").style.display="none";
        syncSticky();
      }));
      const qInp=$("#qInp");
      $("#qDec")?.addEventListener("click",()=>{ qty=Math.max(1,qty-1); qInp.value=qty; });
      $("#qInc")?.addEventListener("click",()=>{ qty=qty+1; qInp.value=qty; });
      qInp?.addEventListener("change",()=>{ qty=Math.max(1,parseInt(qInp.value)||1); qInp.value=qty; });
      $("#addBtn")?.addEventListener("click", addCurrent);
      $("#buyNow")?.addEventListener("click", ()=>{ if(addCurrent()) U.toast("Buy Now → external checkout (stubbed).","info"); });
    }
    function addCurrent(){
      if(!size){ $("#sizeErr").style.display="block"; U.toast("Pick a size first.","error"); return false; }
      U.addToCart(p.id, size, qty);
      U.toast("Added.", "success", { label:"View cart", fn:()=>U.openDrawer("cart") });
      return true;
    }

    // sticky mobile
    function syncSticky(){
      $("#stickyPrice").textContent = "$"+p.price;
      const btn=$("#stickyBtn");
      if(state==="out"){ btn.textContent="Join the waitlist"; btn.className="btn btn-secondary"; btn.style.flex="1"; btn.onclick=()=>U.openWaitlist(p,"waitlist"); }
      else if(state==="pre"){ btn.textContent="Pre-order"; btn.className="btn btn-tier"; btn.dataset.tier=p.tier; btn.style.flex="1"; btn.onclick=()=>U.openWaitlist(p,"pre"); }
      else { btn.textContent="Add to Cart"; btn.className="btn btn-primary"; btn.style.flex="1"; btn.onclick=addCurrent; }
    }
    // show sticky once buy box scrolled past on mobile
    const io = new IntersectionObserver((es)=>es.forEach(en=>{
      $("#stickyBuy").classList.toggle("show", !en.isIntersecting && window.innerWidth<900);
    }), {threshold:0});
    setTimeout(()=>{ const t=$("#buyBox"); if(t) io.observe(t); });

    // mock toggle
    $$(".mock-toggle button").forEach(b=>b.addEventListener("click",()=>{
      state=b.dataset.state; size=null; qty=1;
      $$(".mock-toggle button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
      renderBuyBox();
    }));

    renderBuyBox();

    // pair / cross-sell: 2 same-tier others
    const pair = U.byTier(p.tier).filter(x=>x.id!==p.id).slice(0,2);
    $("#pairGrid").innerHTML = pair.map(U.productCard).join("");
    U.hydrateIcons($("#pairGrid"));

    // related: same tier first, then other
    const rel = [...U.byTier(p.tier).filter(x=>x.id!==p.id), ...U.byTier(p.tier==="dating"?"social":"dating")].slice(0,4);
    $("#relTitle").textContent = `More ${meta.label} pieces`;
    $("#related").innerHTML = rel.map(U.productCard).join("");
    U.hydrateIcons($("#related"));
  
}catch(e){console.error("render "+"product",e);}
}
  },
  "how-it-works": {
    markup: "<main id=\"main\">\n    <section class=\"section-tight\">\n      <div class=\"wrap stack\">\n        <span class=\"eyebrow\">How it works</span>\n        <h1 class=\"display-l balance\">Wear it. Be seen as open. Say hello.</h1>\n        <p class=\"body-lg muted maxw-prose\">No app, no profile, no swiping. Just a colour that strangers can read — and a simple way to be approachable in real life.</p>\n      </div>\n    </section>\n\n    <!-- 4 steps expanded -->\n    <section class=\"section-tight\">\n      <div class=\"wrap stack\" id=\"stepsExpanded\"></div>\n    </section>\n\n    <!-- Read the Signal -->\n    <section class=\"section\" id=\"read-the-signal\" style=\"background:var(--surface);border-block:1px solid var(--line)\">\n      <div class=\"wrap\">\n        <div class=\"section-head\"><span class=\"eyebrow\">Read the signal</span><h2 class=\"balance\">The colour code, in plain words.</h2></div>\n        <div class=\"grid cols-2\">\n          <div class=\"decode-card\" data-tier=\"social\">\n            <span class=\"signal lg\" data-tier=\"social\"></span>\n            <h3>Sun means Social</h3>\n            <p class=\"meaning\">Open to friendship, conversation, and community.</p>\n            <p class=\"muted\">See a Sun signal? That person is up for a hello — a chat in line, a new friend, community over strangers-in-silence. Low stakes, high warmth.</p>\n            <a class=\"btn btn-tier\" data-tier=\"social\" href=\"#/collection?tier=social\">Shop Social</a>\n          </div>\n          <div class=\"decode-card\" data-tier=\"dating\">\n            <span class=\"signal lg\" data-tier=\"dating\"></span>\n            <h3>Rose means Dating</h3>\n            <p class=\"meaning\">Single and open to meeting someone in real life.</p>\n            <p class=\"muted\">A Rose signal says someone is single and open to meeting a person in real life — not on an app.</p>\n            <div class=\"note-control\"><i data-ico=\"lock\"></i><span>Open ≠ obligated. Saying hello is always a choice — yours and theirs.</span></div>\n            <a class=\"btn btn-tier\" data-tier=\"dating\" href=\"#/collection?tier=dating\">Shop Dating</a>\n          </div>\n        </div>\n        <div class=\"callout mt-6\">\n          <h3 style=\"font-family:var(--font-display)\">The one rule: you're always in control.</h3>\n          <p style=\"opacity:.85;max-width:52ch\">Wearing the signal means you're open — not that you owe anyone a conversation. Take it off any time. Say hello when you want to. That's the whole deal.</p>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section-tight\">\n      <div class=\"wrap center stack\" style=\"align-items:center\">\n        <h2 class=\"balance\">Ready to wear yours?</h2>\n        <div class=\"flex gap-3 flex-wrap\" style=\"justify-content:center\">\n          <a class=\"btn btn-tier\" data-tier=\"social\" href=\"#/collection?tier=social\">Shop Social — Sun</a>\n          <a class=\"btn btn-tier\" data-tier=\"dating\" href=\"#/collection?tier=dating\">Shop Dating — Rose</a>\n        </div>\n      </div>\n    </section>\n  </main>",
    render: function(){
try{

    const U = window.UNELLO;
    const STEPS = [
      { ic:"tag",  t:"Choose your signal", d:"Pick Social (Sun) if you're open to friendship and community, or Dating (Rose) if you're single and open to meeting someone. Bracelet or ring — your call. Stack both if that's you." },
      { ic:"hand", t:"Wear it where it's seen", d:"On the wrist or finger, out in the world — cafés, markets, travel, a new city. The signal only works where people are, so wear it out the door." },
      { ic:"sun",  t:"The signal does the talking", d:"You don't have to announce anything. The colour is the message. People who know the code read it at a glance — quietly, no awkward opener required." },
      { ic:"wave", t:"Say hello — on your terms", d:"Someone open notices, and a hello happens. You're never obligated to talk to anyone. Open means available to connect, not available on demand." },
    ];
    document.getElementById("stepsExpanded").innerHTML = STEPS.map((s,i)=>`
      <div class="grid cols-2" style="align-items:center;gap:var(--s-6)">
        <div class="media-frame ${i%2?'':'order-first'}" style="aspect-ratio:16/10;${i%2?'order:2':''}">
          <img src="${U.ph({tier:i%2?'dating':'social',kind:i===2?'macro':'lifestyle',w:900,h:560,label:s.t})}" alt="${s.t}">
        </div>
        <div class="stack" style="${i%2?'order:1':''}">
          <div class="step-head"><div class="ico-wrap">${U.svg(s.ic)}</div><span class="step-num">Step ${i+1}</span></div>
          <h2 style="font-family:var(--font-display)">${s.t}</h2>
          <p class="muted body-lg">${s.d}</p>
        </div>
      </div>${i<STEPS.length-1?'<hr class="divider" style="margin-block:var(--s-2)">':''}`).join("");
    U.hydrateIcons(document.getElementById("stepsExpanded"));
  
}catch(e){console.error("render "+"how-it-works",e);}
}
  },
  "about": {
    markup: "<main id=\"main\">\n    <section class=\"section-tight\">\n      <div class=\"wrap\" style=\"max-width:820px\">\n        <span class=\"eyebrow\">About</span>\n        <h1 class=\"display-l balance mt-3\">Unity + Hello.</h1>\n        <p class=\"body-lg muted pretty mt-4\">Unello is two words pressed into one: <strong>Unity</strong> and <strong>Hello</strong>. It's a small object with a big job — to make the first hello, in real life, a little easier.</p>\n      </div>\n    </section>\n\n    <section class=\"section-tight\">\n      <div class=\"wrap\">\n        <div class=\"media-frame\" style=\"aspect-ratio:21/9\">\n          <img id=\"founderImg\" alt=\"Alicia, founder of Unello\">\n          <span class=\"signal lg\" data-tier=\"dating\" style=\"position:absolute;right:8%;bottom:14%\"></span>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section-tight\">\n      <div class=\"wrap prose\">\n        <h2>Why it exists</h2>\n        <p>We are more connected than ever and lonelier than ever. We sit beside each other and never look up. Meeting people — for friendship or for dating — has quietly moved behind a screen, and something human got lost in the move.</p>\n        <p>Unello puts a signal back into the real world. A bracelet or a ring, in one of two colours, says a simple thing to anyone nearby who knows the code: <em>I'm open. You can say hello.</em></p>\n\n        <h2>The founder</h2>\n        <p>Unello started with Alicia — someone who moved cities one too many times and got tired of how hard it was to simply meet people. Apps felt like work. Bars felt like a gamble. The people she wanted to know were standing right there, in the same café, behind the same invisible wall.</p>\n        <p>So she made the wall a little lower. A piece of jewelry that does one honest thing: it tells the truth about whether you're open. No profile, no performance — just a colour, worn out loud.</p>\n\n        <h2>The mission</h2>\n        <p>Make saying hello easier. Turn \"I wish I'd said something\" into \"I did.\" Build a shared, opt-in signal that works the same on a beach, in a market, or on a morning commute — and that always leaves the wearer in control.</p>\n\n        <h2>A movement, not a store</h2>\n        <p>If you leave understanding the signal but never buy a thing, we still did half our job — because the code only works when people know it. And if you wear one out into the world, you make the next person's hello easier too. That's the whole movement: one signal at a time.</p>\n      </div>\n    </section>\n\n    <section class=\"section-tight\">\n      <div class=\"wrap\">\n        <div class=\"callout reveal\">\n          <span class=\"eyebrow\" style=\"color:var(--paper);opacity:.7\">Join the movement</span>\n          <h2 class=\"balance\" style=\"max-width:18ch\">Wear the signal. Make the first hello easier.</h2>\n          <div class=\"flex gap-3 flex-wrap\">\n            <a class=\"btn btn-tier\" data-tier=\"dating\" href=\"#/shop\">Shop Unello</a>\n          </div>\n          <form class=\"inline-capture mt-2\" data-capture=\"about\" novalidate style=\"width:min(440px,100%)\">\n            <input class=\"input\" type=\"email\" placeholder=\"Your email\" aria-label=\"Email\" required>\n            <button class=\"btn btn-secondary\" type=\"submit\" style=\"background:var(--surface)\">Join</button>\n          </form>\n        </div>\n      </div>\n    </section>\n  </main>",
    render: function(){
try{
document.getElementById("founderImg").src = UNELLO.ph({tier:"dating",kind:"lifestyle",w:1400,h:600,label:"Alicia — founder"});
}catch(e){console.error("render "+"about",e);}
}
  },
  "faq": {
    markup: "<main id=\"main\">\n    <section class=\"section-tight\">\n      <div class=\"wrap stack\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">FAQ</span>\n        <h1 class=\"display-l balance\">Good questions.</h1>\n        <p class=\"body-lg muted\">The idea, how you wear it, staying in control, and getting your order. Still stuck? <a href=\"#/contact\" style=\"text-decoration:underline;text-underline-offset:3px\">Talk to us</a>.</p>\n      </div>\n    </section>\n\n    <section class=\"section-tight\">\n      <div class=\"wrap\" style=\"max-width:760px\" id=\"faqGroups\"></div>\n    </section>\n\n    <section class=\"section-tight\">\n      <div class=\"wrap center stack\" style=\"align-items:center\">\n        <span class=\"signal lg\" data-tier=\"social\"></span>\n        <h2>Still curious?</h2>\n        <p class=\"muted maxw-narrow\">We're real people and we like saying hello. Reach out any time.</p>\n        <a class=\"btn btn-primary\" href=\"#/contact\">Contact us</a>\n      </div>\n    </section>\n  </main>",
    render: function(){
try{

    const U = window.UNELLO;
    const GROUPS = [
      ["The idea", [
        ["What is Unello, exactly?", "Wearable jewelry that works as a social signal. A bracelet or ring in one of two colours tells people nearby that you're open to connecting in real life — Social (Sun) for friendship, Dating (Rose) for meeting someone."],
        ["Who reads the signal?", "Anyone who knows the code. The more people who learn it, the better it works — which is why we treat Unello as a movement, not just a product."],
        ["Is this an app or a dating service?", "Neither. There's no profile, no matching, no swiping. The whole point is to move connection back into the real world. The jewelry is the entire interface."],
      ]],
      ["Wearing it & staying in control", [
        ["Do I have to talk to everyone who notices?", "No. Open means you're approachable — not obligated. You decide, every single time, whether to say hello back. Wearing the signal is an invitation you control, not a contract."],
        ["Can I wear Social and Dating at the same time?", "Yes. Plenty of people stack both — open to new friends and open to dating. Others keep it to one. Whatever's true for you."],
        ["Is it safe to wear?", "The signal is subtle and only legible to people who know the code. You choose when and where to wear it, and you can take it off any time. Control stays with you."],
        ["How do I find my size?", "Wrap a strip of paper or soft tape around your wrist (bracelets) or the base of your finger (rings), snug but not tight, and match it to our size guide. Cords are adjustable. Between ring sizes? Size up."],
      ]],
      ["Orders, shipping & returns", [
        ["When will my order ship?", "In-stock pieces ship in 1–2 business days with tracked delivery. Pre-orders ship in 3–4 weeks — you'll get a heads-up before it goes out."],
        ["How much is shipping?", "Free over $75. Below that, a flat rate is shown at checkout. We ship from the US."],
        ["What's your return policy?", "30 days. If it's not right, send it back for a refund or a swap — no drama."],
        ["Can I buy one for a friend?", "Please do — it's one of the best ways to grow the movement. Add a note at checkout and we'll keep the packaging gift-ready."],
        ["Something's sold out — now what?", "Join the waitlist on the product page and we'll email you the moment it's back. If a piece is on pre-order, you can reserve it now and it ships in 3–4 weeks."],
      ]],
    ];
    document.getElementById("faqGroups").innerHTML = GROUPS.map(([title, items], gi)=>`
      <div class="mb-5">
        <h2 class="mb-3" style="font-size:clamp(20px,2.6vw,24px)">${title}</h2>
        <div class="accordion">
          ${items.map(([q,a],i)=>`
            <div class="accordion-item">
              <button class="accordion-trigger" aria-expanded="${gi===0&&i===0?'true':'false'}" aria-controls="g${gi}q${i}">${q}<i data-ico="plus"></i></button>
              <div class="accordion-panel" id="g${gi}q${i}"><div class="panel-inner"><p>${a}</p></div></div>
            </div>`).join("")}
        </div>
      </div>`).join("");
    U.initAccordions(document.getElementById("faqGroups"));
    U.hydrateIcons(document.getElementById("faqGroups"));
  
}catch(e){console.error("render "+"faq",e);}
}

  "contact": {
    markup: "<main id=\"main\">\n    <section class=\"section-tight\">\n      <div class=\"wrap grid cols-2\" style=\"gap:var(--s-7);align-items:start\">\n        <div class=\"stack\">\n          <span class=\"eyebrow\">Contact</span>\n          <h1 class=\"display-l balance\">Say hello.</h1>\n          <p class=\"body-lg muted maxw-prose\">Questions, sizing help, wholesale, press, or just want to tell us your Unello story — we're listening.</p>\n          <div class=\"stack mt-4\">\n            <a class=\"flex\" style=\"align-items:center;gap:var(--s-3)\" href=\"mailto:hello@unello.example\"><i data-ico=\"mail\" style=\"color:var(--ink-soft)\"></i> hello@unello.example</a>\n            <a class=\"flex\" style=\"align-items:center;gap:var(--s-3)\" href=\"#\"><i data-ico=\"insta\" style=\"color:var(--ink-soft)\"></i> @unello</a>\n            <div class=\"flex\" style=\"align-items:center;gap:var(--s-3)\"><i data-ico=\"chat\" style=\"color:var(--ink-soft)\"></i> We reply within 1 business day.</div>\n          </div>\n          <div class=\"note-control\" style=\"background:var(--social-tint);color:var(--social-ink);max-width:46ch\">\n            <i data-ico=\"wave\"></i><span>Friendly humans, not a ticket queue. Tell us what you need and we'll sort it.</span>\n          </div>\n        </div>\n\n        <form class=\"card stack\" style=\"padding:var(--s-6)\" id=\"contactForm\" novalidate>\n          <div class=\"field\"><label for=\"cname\">Name <span class=\"req\">*</span></label>\n            <input class=\"input\" id=\"cname\" name=\"name\" required autocomplete=\"name\">\n            <span class=\"field-error\">Please add your name.</span></div>\n          <div class=\"field\"><label for=\"cemail\">Email <span class=\"req\">*</span></label>\n            <input class=\"input\" id=\"cemail\" name=\"email\" type=\"email\" required autocomplete=\"email\">\n            <span class=\"field-error\">Enter a valid email.</span></div>\n          <div class=\"field\"><label for=\"cmsg\">Message <span class=\"req\">*</span></label>\n            <textarea class=\"textarea\" id=\"cmsg\" name=\"message\" required placeholder=\"What's on your mind?\"></textarea>\n            <span class=\"field-error\">Add a short message.</span></div>\n          <button class=\"btn btn-primary btn-lg\" type=\"submit\">Send message</button>\n          <p class=\"small muted\">By sending, you agree to our <a href=\"#/privacy\" style=\"text-decoration:underline\">privacy policy</a>.</p>\n        </form>\n      </div>\n    </section>\n  </main>",
    render: function(){
try{

    const U = window.UNELLO, f = document.getElementById("contactForm");
    f.addEventListener("submit", (e)=>{
      e.preventDefault(); let ok=true;
      [["cname",v=>v.trim()],["cemail",v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)],["cmsg",v=>v.trim().length>2]].forEach(([id,test])=>{

ain>",

(function(){
  const U = window.UNELLO;
  function currentKey(){
    const raw = (location.hash || "#/").slice(1);
    const path = raw.split("?")[0].replace(/^\//,"");
    return path === "" ? "home" : (PAGES[path] ? path : "404");
  }
  function route(){
    const key = currentKey();
    const def = PAGES[key];
    const view = document.getElementById("view");
    view.innerHTML = def.markup;
    // beach uses minimal chrome
    const minimal = key === "beach";
    document.getElementById("header").style.display = minimal ? "none" : "";
    document.getElementById("footer").style.display = minimal ? "none" : "";
    if (def.render) def.render();
    U.hydrateIcons(view); U.initAccordions(view); U.initCaptures(view); U.initReveal();
    // reflect active nav
    document.querySelectorAll(".nav-desktop a").forEach(a=>{
      const h=a.getAttribute("href")||""; a.toggleAttribute("aria-current", h!=="#/" && location.hash.startsWith(h));
    });
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("DOMContentLoaded", function(){
    U.mountChrome();
    if (!location.hash) location.replace("#/");
    route();
  });
})();

  </script>
