<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop · Unello</title>
  <meta name="description" content="Shop Unello bracelets. Wear one to show you're open to connecting in real life.">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header"></div>

  <main id="main">
    <section class="section-sm">
      <div class="wrap">
        <p class="kicker red">The collection</p>
        <h1 class="display mt-3" style="font-size:clamp(40px,7vw,88px)">Bracelets</h1>
        <p class="lead maxw-prose mt-4">Six ways to wear the same idea. Choose the one that feels like you, then wear it where it's seen.</p>
      </div>
    </section>

    <section class="section-sm" style="padding-top:0">
      <div class="wrap">
        <div class="between" style="flex-wrap:wrap">
          <p class="small faint" id="resultCount" aria-live="polite"></p>
          <div class="field" style="min-width:190px">
            <label class="sr-only" for="sort">Sort</label>
            <select class="select" id="sort">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </div>
        </div>

        <form class="filters" id="filters" aria-label="Filter products">
          <fieldset><legend>Style</legend>
            <label><input type="checkbox" name="style" value="Cord"> Cord</label>
            <label><input type="checkbox" name="style" value="Beaded"> Beaded</label>
            <label><input type="checkbox" name="style" value="Chain"> Chain</label>
            <label><input type="checkbox" name="style" value="Cuff"> Cuff</label>
            <label><input type="checkbox" name="style" value="Woven"> Woven</label>
            <label><input type="checkbox" name="style" value="Charm"> Charm</label>
          </fieldset>
          <fieldset><legend>Price</legend>
            <label><input type="checkbox" name="price" value="0-45"> Under $45</label>
            <label><input type="checkbox" name="price" value="45-60"> $45 to 60</label>
            <label><input type="checkbox" name="price" value="60-999"> $60+</label>
          </fieldset>
          <fieldset><legend>Availability</legend>
            <label><input type="checkbox" name="avail" value="in"> In stock</label>
            <label><input type="checkbox" name="avail" value="pre"> Pre-order</label>
          </fieldset>
          <button type="button" class="ulink" id="clearFilters">Clear all</button>
        </form>

        <div class="grid cols-3 mt-6" id="grid" style="gap:var(--s-5)"></div>
        <div class="empty-state hide" id="empty">
          <i data-ico="search"></i>
          <div><h3>Nothing matches those filters</h3><p class="muted mt-2">Try clearing one.</p></div>
          <button class="btn btn-outline" id="emptyClear">Clear filters</button>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/brand.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const U = window.UNELLO, $ = (s)=>document.querySelector(s), $$=(s)=>Array.from(document.querySelectorAll(s));
    const grid = $("#grid"), empty = $("#empty"), form = $("#filters");
    const checked = (n)=>$$(`input[name="${n}"]:checked`).map(i=>i.value);
    const inPrice = (p,r)=> r.length===0 || r.some(x=>{const[a,b]=x.split("-").map(Number); return p.price>=a&&p.price<=b;});
    function apply(){
      const styles=checked("style"), prices=checked("price"), avail=checked("avail");
      let list = U.products.filter(p=>
        (styles.length===0||styles.includes(p.style)) &&
        inPrice(p,prices) &&
        (avail.length===0||avail.includes(p.inventory)));
      const s=$("#sort").value;
      if(s==="price-asc") list.sort((a,b)=>a.price-b.price);
      else if(s==="price-desc") list.sort((a,b)=>b.price-a.price);
      grid.innerHTML = list.map(U.productCard).join("");
      $("#resultCount").textContent = `${list.length} piece${list.length===1?"":"s"}`;
      empty.classList.toggle("hide", list.length>0);
      grid.classList.toggle("hide", list.length===0);
    }
    form.addEventListener("change", apply);
    $("#sort").addEventListener("change", apply);
    $("#clearFilters").addEventListener("click", ()=>{ form.reset(); apply(); });
    $("#emptyClear").addEventListener("click", ()=>{ form.reset(); apply(); });
    apply();
    U.hydrateIcons(document);
  </script>
</body>
</html>
