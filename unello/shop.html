<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop · Unello</title>
  <meta name="description" content="Shop Unello bracelets. Wear one to show you're open to connecting in real life.">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header"></div>

  <main id="main">
    <section class="section-sm">
      <div class="wrap">
        <p class="kicker red">The collection</p>
        <h1 class="display mt-3" style="font-size:clamp(40px,7vw,88px)">Bracelets</h1>
        <p class="lead maxw-prose mt-4">Six ways to wear the same idea. Choose the one that feels like you, then wear it where it's seen.</p>
      </div>
    </section>

    <section class="section-sm" style="padding-top:0">
      <div class="wrap">
        <div class="shopbar">
          <div class="fpills" id="fpills" role="group" aria-label="Filter by style">
            <button class="fpill" data-value="" aria-pressed="true">All</button>
            <button class="fpill" data-value="Cord" aria-pressed="false">Cord</button>
            <button class="fpill" data-value="Beaded" aria-pressed="false">Beaded</button>
            <button class="fpill" data-value="Chain" aria-pressed="false">Chain</button>
            <button class="fpill" data-value="Cuff" aria-pressed="false">Cuff</button>
            <button class="fpill" data-value="Woven" aria-pressed="false">Woven</button>
            <button class="fpill" data-value="Charm" aria-pressed="false">Charm</button>
          </div>
          <div class="sortbar">
            <span class="small" id="resultCount" aria-live="polite"></span>
            <label class="sr-only" for="sort">Sort</label>
            <select class="sort-select" id="sort">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </div>
        </div>

        <div class="grid cols-3 mt-7" id="grid" style="gap:var(--s-5)"></div>
        <div class="empty-state hide" id="empty">
          <i data-ico="search"></i>
          <div><h3>Nothing here yet</h3><p class="muted mt-2">Try another style.</p></div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/brand.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const U = window.UNELLO, $ = (s)=>document.querySelector(s), $$=(s)=>Array.from(document.querySelectorAll(s));
    const grid = $("#grid"), empty = $("#empty");
    let style = "";
    function apply(){
      let list = U.products.filter(p => !style || p.style===style);
      const s=$("#sort").value;
      if(s==="price-asc") list.sort((a,b)=>a.price-b.price);
      else if(s==="price-desc") list.sort((a,b)=>b.price-a.price);
      grid.innerHTML = list.map(U.productCard).join("");
      $("#resultCount").textContent = `${list.length} piece${list.length===1?"":"s"}`;
      empty.classList.toggle("hide", list.length>0);
      grid.classList.toggle("hide", list.length===0);
    }
    $$("#fpills .fpill").forEach(b=>b.addEventListener("click",()=>{
      style = b.dataset.value;
      $$("#fpills .fpill").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
      apply();
    }));
    $("#sort").addEventListener("change", apply);
    apply();
    U.hydrateIcons(document);
  </script>
</body>
</html>
